<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>汉语 — Тренажёр китайского языка</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/colors.css" />
  </head>
  <body>
    <main class="container">
      <h1><span class="accent-text">汉语</span> <small>тренажёр</small></h1>
      <button id="accent-btn" aria-label="Сменить акцент">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path
            fill="none"
            stroke="currentColor"
            stroke-dasharray="28"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3c0 0 7 6 7 12c0 2 -1 6 -7 6M12 3c0 0 -7 6 -7 12c0 2 1 6 7 6"
          >
            <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="28;0" />
          </path>
          <path
            fill="currentColor"
            fill-opacity="0"
            d="M12 3c0 0 3.27 2.81 5.34 6.5l-11.34 8.91c-0.79 -1.17 -1 -2.5 -1 -3.41c0 -6 7 -12 7 -12Z"
          >
            <animate fill="freeze" attributeName="fill-opacity" begin="0.6s" dur="0.4s" to="1" />
          </path>
        </svg>
      </button>
      <button id="theme-btn" aria-label="Включить тёмную тему">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <g fill="currentColor">
            <path
              fill-opacity="0"
              stroke="currentColor"
              stroke-dasharray="56"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 6c0 6.08 4.92 11 11 11c0.53 0 1.05 -0.04 1.56 -0.11c-1.61 2.47 -4.39 4.11 -7.56 4.11c-4.97 0 -9 -4.03 -9 -9c0 -3.17 1.64 -5.95 4.11 -7.56c-0.07 0.51 -0.11 1.03 -0.11 1.56Z"
            >
              <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="56;0" />
              <animate fill="freeze" attributeName="fill-opacity" begin="0.7s" dur="0.15s" to="0.3" />
            </path>
            <path
              d="M15.22 6.03l2.53 -1.94l-3.19 -0.09l-1.06 -3l-1.06 3l-3.19 0.09l2.53 1.94l-0.91 3.06l2.63 -1.81l2.63 1.81l-0.91 -3.06Z"
              opacity="0"
            >
              <animate
                attributeName="opacity"
                begin="0.95s"
                dur="6s"
                keyTimes="0;0.1;0.4;0.5;1"
                repeatCount="indefinite"
                values="0;1;1;0;0"
              />
            </path>
            <path
              d="M19.61 12.25l1.64 -1.25l-2.06 -0.05l-0.69 -1.95l-0.69 1.95l-2.06 0.05l1.64 1.25l-0.59 1.98l1.7 -1.17l1.7 1.17l-0.59 -1.98Z"
              opacity="0"
            >
              <animate
                attributeName="opacity"
                begin="0.95s"
                dur="6s"
                keyTimes="0;0.2;0.3;0.6;0.7;1"
                repeatCount="indefinite"
                values="0;0;1;1;0;0"
              />
            </path>
            <path
              d="M13.61 5.25l1.64 -1.25l-2.06 -0.05l-0.69 -1.95l-0.69 1.95l-2.06 0.05l1.64 1.25l-0.59 1.98l1.7 -1.17l1.7 1.17Z"
              opacity="0"
            >
              <animate
                attributeName="opacity"
                begin="3.95s"
                dur="6s"
                keyTimes="0;0.1;0.4;0.5;1"
                repeatCount="indefinite"
                values="0;1;1;0;0"
              />
            </path>
            <path
              d="M20.83 9.73l1.88 -1.44l-2.37 -0.07l-0.79 -2.22l-0.79 2.23l-2.37 0.07l1.88 1.44l-0.68 2.27l1.95 -1.34l1.95 1.34Z"
              opacity="0"
            >
              <animate
                attributeName="opacity"
                begin="3.95s"
                dur="6s"
                keyTimes="0;0.2;0.3;0.6;0.7;1"
                repeatCount="indefinite"
                values="0;0;1;1;0;0"
              />
            </path>
          </g>
        </svg>
      </button>

      <div class="controls">
        <label for="lesson">
          Урок
          <select id="lesson" autocomplete="off"></select>
        </label>
        <label for="mode">
          Показывать
          <select id="mode" autocomplete="off">
            <option value="ch">Иероглиф</option>
            <option value="pn">Пиньинь</option>
            <option value="ru" selected>Русский</option>
          </select>
        </label>
      </div>

      <article id="card">
        <div id="display"></div>
        <div id="answer" hidden>
          <hr />
          <div id="answer-content"></div>
        </div>
      </article>

      <div class="nav-buttons">
        <button id="prev" class="outline" title="Предыдущий (←)">◀</button>
        <button id="show-answer">Показать ответ</button>
        <button id="next" class="outline" title="Следующий (→)">▶</button>
      </div>

      <div id="counter"></div>
    </main>

    <footer>
      <div class="container">нажмите на карточку или пробел, чтобы показать ответ</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
