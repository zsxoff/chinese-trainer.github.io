<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>汉语 — Тренажёр китайского языка</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>汉语 <small>тренажёр</small></h1>
      <button id="theme-btn" aria-label="Включить тёмную тему">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32" fill="currentColor">
          <clipPath id="theme-cutout"><path d="M0-11h25a1 1 0 0117 13v30H0Z" /></clipPath>
          <g clip-path="url(#theme-cutout)">
            <circle cx="16" cy="16" r="8.4" />
            <path
              d="M18.3 3.2c0 1.3-1 2.3-2.3 2.3s-2.3-1-2.3-2.3S14.7.9 16 .9s2.3 1 2.3 2.3zm-4.6 25.6c0-1.3 1-2.3 2.3-2.3s2.3 1 2.3 2.3-1 2.3-2.3 2.3-2.3-1-2.3-2.3zm15.1-10.5c-1.3 0-2.3-1-2.3-2.3s1-2.3 2.3-2.3 2.3 1 2.3 2.3-1 2.3-2.3 2.3zM3.2 13.7c1.3 0 2.3 1 2.3 2.3s-1 2.3-2.3 2.3S.9 17.3.9 16s1-2.3 2.3-2.3zm5.8-7C9 7.9 7.9 9 6.7 9S4.4 8 4.4 6.7s1-2.3 2.3-2.3S9 5.4 9 6.7zm16.3 21c-1.3 0-2.3-1-2.3-2.3s1-2.3 2.3-2.3 2.3 1 2.3 2.3-1 2.3-2.3 2.3zm2.4-21c0 1.3-1 2.3-2.3 2.3S23 7.9 23 6.7s1-2.3 2.3-2.3 2.4 1 2.4 2.3zM6.7 23C8 23 9 24 9 25.3s-1 2.3-2.3 2.3-2.3-1-2.3-2.3 1-2.3 2.3-2.3z"
            />
          </g>
        </svg>
      </button>

      <div class="controls">
        <label for="lesson">
          Урок
          <select id="lesson" autocomplete="off"></select>
        </label>
        <label for="mode">
          Показывать
          <select id="mode" autocomplete="off">
            <option value="ch">Иероглиф</option>
            <option value="pn">Пиньинь</option>
            <option value="ru" selected>Русский</option>
          </select>
        </label>
      </div>

      <article id="card">
        <div id="display"></div>
        <div id="answer" hidden>
          <hr />
          <div id="answer-content"></div>
        </div>
      </article>

      <div class="nav-buttons">
        <button id="prev" class="outline" title="Предыдущий (←)">◀</button>
        <button id="show-answer">Показать ответ</button>
        <button id="next" class="outline" title="Следующий (→)">▶</button>
      </div>

      <div id="counter"></div>
    </main>

    <footer>
      <div class="container">нажмите на карточку или пробел, чтобы показать ответ</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
