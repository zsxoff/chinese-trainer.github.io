<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中文 — Китайский тренажёр</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      main.container {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: 640px;
      }
      h1 {
        text-align: center;
        margin-bottom: 0;
      }
      h1 small {
        font-size: 0.5em;
        opacity: 0.6;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--pico-grid-column-gap, 1rem);
        margin-top: 1rem;
      }
      #card {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        min-height: 320px;
        margin-top: 1rem;
        margin-bottom: 1rem;
        padding: 2rem;
        cursor: pointer;
        transition: min-height 0.2s;
      }
      #display {
        font-size: 4rem;
        line-height: 1.3;
        word-break: break-word;
        user-select: none;
      }
      #display.lang-ru {
        font-size: 2.5rem;
      }
      #display.lang-pn {
        font-size: 2.5rem;
      }
      #answer {
        width: 100%;
        margin-top: 1rem;
        animation: fadeIn 0.2s ease;
      }
      #answer p {
        margin-bottom: 0.25rem;
      }
      #answer p:last-child {
        margin-bottom: 0;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .nav-buttons {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: var(--pico-grid-column-gap, 0.5rem);
        align-items: stretch;
      }
      .nav-buttons button:first-child,
      .nav-buttons button:last-child {
        width: 4rem;
        font-size: 1.25rem;
      }
      #counter {
        text-align: center;
        margin-top: 0.5rem;
        color: var(--pico-muted-color);
      }
      #show-answer {
        font-size: 1rem;
        font-weight: 600;
      }
      footer {
        text-align: center;
        padding: 1rem 0;
        color: var(--pico-muted-color);
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>中文 <small>тренажёр</small></h1>

      <div class="controls">
        <label for="lesson">
          Урок
          <select id="lesson" autocomplete="off"></select>
        </label>
        <label for="mode">
          Показывать
          <select id="mode" autocomplete="off">
            <option value="ch">Иероглиф</option>
            <option value="pn">Пиньинь</option>
            <option value="ru" selected>Русский</option>
          </select>
        </label>
      </div>

      <article id="card">
        <div id="display"></div>
        <div id="answer" hidden>
          <hr />
          <div id="answer-content"></div>
        </div>
      </article>

      <div class="nav-buttons">
        <button id="prev" class="outline" title="Предыдущий (←)">◀</button>
        <button id="show-answer">Показать ответ</button>
        <button id="next" class="outline" title="Следующий (→)">▶</button>
      </div>

      <div id="counter"></div>
    </main>

    <footer>
      <div class="container">нажмите на карточку или пробел, чтобы показать ответ</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script>
      (function () {
        const YAML_FILES = ["static/09.yaml", "static/10.yaml"];

        let allWords = [];
        let lessonWords = [];
        let currentIndex = 0;
        let currentMode = "ru";
        let answerShown = false;

        const lessonSelect = document.getElementById("lesson");
        const modeSelect = document.getElementById("mode");
        const card = document.getElementById("card");
        const displayEl = document.getElementById("display");
        const answerEl = document.getElementById("answer");
        const answerContent = document.getElementById("answer-content");
        const prevBtn = document.getElementById("prev");
        const nextBtn = document.getElementById("next");
        const showBtn = document.getElementById("show-answer");
        const counterEl = document.getElementById("counter");

        function shuffle(arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        function render() {
          if (!lessonWords.length) {
            displayEl.textContent = "← выберите урок";
            answerEl.hidden = true;
            showBtn.disabled = true;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            counterEl.textContent = "";
            return;
          }

          const word = lessonWords[currentIndex];
          const text = word[currentMode];
          displayEl.textContent = text;

          displayEl.className = "";
          if (currentMode === "ru") displayEl.classList.add("lang-ru");
          if (currentMode === "pn") displayEl.classList.add("lang-pn");

          if (answerShown) {
            answerContent.innerHTML =
              "<p><strong>Иероглиф:</strong> " +
              word.ch +
              "</p>" +
              "<p><strong>Пиньинь:</strong> " +
              word.pn +
              "</p>" +
              "<p><strong>Русский:</strong> " +
              word.ru +
              "</p>";
            answerEl.hidden = false;
            showBtn.textContent = "Продолжить →";
          } else {
            answerEl.hidden = true;
            showBtn.textContent = "Показать ответ";
          }

          showBtn.disabled = false;
          prevBtn.disabled = false;
          nextBtn.disabled = false;
          counterEl.textContent = currentIndex + 1 + " / " + lessonWords.length;
        }

        function showAnswer() {
          if (!lessonWords.length) return;
          if (answerShown) {
            nextWord();
            return;
          }
          answerShown = true;
          render();
        }

        function prevWord() {
          if (!lessonWords.length) return;
          currentIndex = (currentIndex - 1 + lessonWords.length) % lessonWords.length;
          answerShown = false;
          render();
        }

        function nextWord() {
          if (!lessonWords.length) return;
          currentIndex = (currentIndex + 1) % lessonWords.length;
          answerShown = false;
          render();
        }

        function selectLesson(lesson) {
          const filtered = allWords.filter(function (w) {
            return w.lesson === lesson;
          });
          lessonWords = shuffle(filtered.slice());
          currentIndex = 0;
          answerShown = false;
          render();
        }

        function populateLessons() {
          var seen = {};
          var lessons = [];
          allWords.forEach(function (w) {
            if (!seen[w.lesson]) {
              seen[w.lesson] = true;
              lessons.push(w.lesson);
            }
          });
          lessons.sort(function (a, b) {
            return a - b;
          });

          lessons.forEach(function (l) {
            var opt = document.createElement("option");
            opt.value = l;
            opt.textContent = "Урок " + l;
            lessonSelect.appendChild(opt);
          });

          if (lessons.length > 0) {
            lessonSelect.value = lessons[0];
            selectLesson(lessons[0]);
          }
        }

        async function loadData() {
          for (const file of YAML_FILES) {
            try {
              const resp = await fetch(file);
              if (!resp.ok) continue;
              const text = await resp.text();
              const data = jsyaml.load(text);
              if (Array.isArray(data)) {
                allWords = allWords.concat(data);
              }
            } catch (_) {
              // skip unavailable files
            }
          }
          populateLessons();
        }

        lessonSelect.addEventListener("change", function () {
          selectLesson(Number(this.value));
        });

        modeSelect.addEventListener("change", function () {
          currentMode = this.value;
          answerShown = false;
          render();
        });

        showBtn.addEventListener("click", showAnswer);
        card.addEventListener("click", showAnswer);
        prevBtn.addEventListener("click", prevWord);
        nextBtn.addEventListener("click", nextWord);

        document.addEventListener("keydown", function (e) {
          if (e.target.tagName === "SELECT") return;
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            prevWord();
          }
          if (e.key === "ArrowRight") {
            e.preventDefault();
            nextWord();
          }
          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            showAnswer();
          }
        });

        loadData();
      })();
    </script>
  </body>
</html>
